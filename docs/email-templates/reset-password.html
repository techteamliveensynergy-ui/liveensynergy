<!-- Supabase → Authentication → Email Templates → "Reset password"
     Subject: Set your Live·En·Synergy password
     Also used as the "set your password" email for accounts created from a
     survey (FB-00032) — opening it confirms their email address (0069). -->
<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background:#fcf7f0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#fcf7f0;padding:32px 12px;font-family:Arial,Helvetica,sans-serif;color:#2c2422;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background:#ffffff;border-radius:16px;border:1px solid #eadfd2;">
            <tr>
              <td style="padding:28px 32px 8px 32px;font-size:20px;font-weight:bold;">
                Live<span style="color:#ed9a4e;">·</span>En<span style="color:#ed9a4e;">·</span>Synergy
              </td>
            </tr>
            <tr>
              <td style="padding:8px 32px 0 32px;">
                <h1 style="margin:0 0 12px 0;font-size:24px;line-height:1.3;">Set your password</h1>
                <p style="margin:0 0 16px 0;font-size:15px;line-height:1.6;color:#4a3f3b;">
                  Use the button below to choose a password for <strong>{{ .Email }}</strong>. Opening it also confirms
                  this email address is yours.
                </p>
              </td>
            </tr>
            <tr>
              <td align="center" style="padding:8px 32px;">
                <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&type=recovery&next=/auth/reset-password"
                   style="display:inline-block;background:#ed9a4e;color:#ffffff;text-decoration:none;font-weight:bold;font-size:16px;padding:14px 28px;border-radius:999px;">
                  Set my password
                </a>
              </td>
            </tr>
            <tr>
              <td style="padding:16px 32px 28px 32px;">
                <p style="margin:0 0 8px 0;font-size:12px;line-height:1.6;color:#7a6e69;">
                  The link works once and expires in 1 hour. Didn't ask for this? You can ignore it — your password
                  stays the same.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
